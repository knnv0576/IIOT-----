apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: ${TIMESCALEDB_DB}
    user: ${TIMESCALEDB_USER}
    secureJsonData:
      password: ${TIMESCALEDB_PASSWORD}
    jsonData:
      database: ${TIMESCALEDB_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
